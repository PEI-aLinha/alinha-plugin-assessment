  - id: CTRL-B
    title: "Substantial control"
    level: substantial
    technical: false
    evidence:
      - "Evidence B."
    questions:
      - id: CTRL-B-Q1
        text: "Question B?"
        explanation: "Why B matters."
        example: "Example B."
        answers: ["yes", "partial", "no", "unknown"]

  - id: CTRL-C
    title: "High technical control"
    level: high
    technical: true
    evidence:
      - "Evidence C."
    questions:
      - id: CTRL-C-Q1
        text: "Question C?"
        explanation: "Why C matters."
        example: "Example C."
        answers: ["yes", "no"]